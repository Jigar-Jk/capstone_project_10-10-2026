version: 2

models:
  - name: stg_banking
    description: "Cleaned, typed and de-duplicated banking data. One row per transaction."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: transaction_status
        tests:
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'PENDING']